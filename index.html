<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixathon</title>
<link rel="preload" href="fonts/ABCAreal-Medium.woff2?v=3" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ABCAreal-MediumItalic.woff2?v=3" as="font" type="font/woff2" crossorigin>
<style>
  /* ABC Areal from the fonts folder: woff2 first, ttf for browsers without woff2.
     ?v= busts any old cached copy; bump it when the font files change. */
  @font-face {
    font-family: "Areal";
    src: url("fonts/ABCAreal-Medium.woff2?v=3") format("woff2"),
         url("fonts/ABCAreal-Medium.ttf?v=3") format("truetype");
    font-weight: 500; font-style: normal; font-display: block;
  }
  @font-face {
    font-family: "Areal";
    src: url("fonts/ABCAreal-MediumItalic.woff2?v=3") format("woff2"),
         url("fonts/ABCAreal-MediumItalic.ttf?v=3") format("truetype");
    font-weight: 500; font-style: italic; font-display: block;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Background pink. Deeper than Climax's #FF78C8 because the screen washes colour out.
     Try other values on the screen itself with ?bg=FF1F7A in the address. */
  :root { --bg: #FF2E93; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: #000;
    font-family: "Areal", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }

  /* Fixed 1920 x 1080 stage scaled to fit the screen */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }

  /* Label + text. Top edge fixed (ROW_TOP in the script), so FIXATHON and the
     first line keep the same height on screen in every state. */
  .row {
    position: absolute; left: 320px; top: 187px;   /* FIXATHON at x = 320 */
    display: flex; align-items: baseline;
  }
  .left { width: 524px; }     /* text column starts at x = 844 */
  /* Type sizes: label 44/50, text and marquee 38/44 (was 48/54 and 42/48) */
  .label {
    font-size: 44px; line-height: 50px; letter-spacing: -0.4px;
    text-transform: uppercase;
  }
  /* Marquee, as on climaxbooks.com: body size, steady linear scroll.
     Each sentence is its own small element moved by the script, so weak TV
     browsers never have to handle one huge strip. */
  .marquee {
    position: absolute; left: 0; bottom: 0; width: 1920px; height: 44px;
    padding: 0; overflow: hidden; white-space: nowrap;
    font-size: 38px; line-height: 44px; letter-spacing: -0.4px;
  }
  .strip { position: absolute; left: 0; bottom: 0; width: 1920px; height: 210px; display: none; }
  .track { position: relative; height: 44px; }
  .mq { position: absolute; left: 0; top: 0; white-space: pre; will-change: transform; }
  .text {
    position: relative;
    width: 727px;
    font-size: 38px; line-height: 44px; letter-spacing: -0.4px;
  }
  .row1 { display: block; }
  .wd { visibility: hidden; }
  .wd.on { visibility: visible; }
  .cursor { position: absolute; width: 4px; background: #000; display: none; }
  .text p { margin-bottom: 44px; }
  .text p:last-of-type { margin-bottom: 0; }   /* last paragraph: no empty line under it */
  .nb { white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="row" id="row">
    <div class="left" id="left">
      <div class="label">Pink Room</div>
    </div>
    <div class="text" id="text"></div>
  </div>
  <img class="strip" id="strip" alt="">
  <div class="marquee" id="marquee" aria-label="We need bigger prompts. AI is the most powerful tool humanity has ever held. The question is what we choose to do with it. We’re calling on a new generation of problem engineers. Founders who will use this divine intelligence to tackle what matters: our climate, our health, our food systems, our future. Let’s prompt what matters.">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   CONTENT, from Nina's Figma mockup. hold = ms on screen.
---------------------------------------------------------------- */
const STATES = [
  {
    hold: 15000,
    typed: 2,   // type the first two lines (the question too), then reveal the rest
    text: [
      '<span class="nb">50 fixers. 24 hours. One question:</span><br><i>Can AI help turn climate commitments <span class="nb">into action?</span></i>',
      'This was the <i>Fixathon</i>, Norrsken’s version of a hackathon.',
      '<span class="nb">50 multidisciplinary</span> <span class="nb">problem-solvers</span> from across Europe built solutions with AI, data, and open tools to help get climate action back on track ahead of <i>COP31</i>.'
    ]
  },
  {
    hold: 15000,
    text: [
      '<span class="nb">Curious to see what they built?</span><br>Whether you build companies, fund them, work in policy, or just care about the planet, come watch the best teams pitch live and cheer on the winners.',
      'Fixathon Demos<br><i class="nb">Climate Solutions Built in 24 Hours</i><br>October 15, 14:10-15:00<br>Pink Room',
      'Spotlight On<br><i>The Fixathon Winning Team</i><br>October 15, 16:10-16:30<br>Town Hall'
    ]
  },
  {
    hold: 6000,
    centre: true,   // the line sits in the middle of the screen; FIXATHON stays where it is
    text: ['prompt what matters.']
  }
];

/* Marquee phrases: [text, colour]. Two spaces between, like Climax. */
/* Distance from the bottom of the screen to the marquee. TVs often crop the
   edges of the picture (overscan), so it sits a little above the edge. */
const SAFE_BOTTOM = 32;

/* States with centre: true put their text in the middle of the screen, both ways */
const CENTRE_X = 960, CENTRE_Y = 540;

/* Top edge of FIXATHON + text, the same in every state (FIXATHON never moves up
   or down). 187 keeps the tallest state centred. Higher number = lower on screen. */
const ROW_TOP = 187;

/* Version of this page. The screen checks version.txt every minute and reloads
   itself when it changes, so updates reach it without anyone touching it.
   Change BUILD and version.txt together. */
const BUILD = '2026-10-15a';

/* Bottom edge: 'gif' = fixers.gif strip, 'text' = the marquee below.
   Compare quickly with ?bottom=text or ?bottom=gif in the address. */
let BOTTOM = 'text';

/* Marquee copy, one sentence per entry. Set an entry to white to change its colour. */
const MARQUEE = [
  ['We need bigger prompts.', 'black'],
  ['AI is the most powerful tool humanity has ever held.', 'black'],
  ['The question is what we choose to do with it.', 'black'],
  ['We’re calling on a new generation of problem engineers.', 'black'],
  ['Founders who will use this divine intelligence to tackle what matters: our climate, our health, our food systems, our future.', 'black'],
  ['Let’s prompt what matters.', 'black']
];
const MARQUEE_PX_PER_S = 75;   // Climax's speed, scaled to this size

/* Motion: text steps out line by line, the first line is typed word by word
   with a cursor, then the rest steps in line by line. FIXATHON never moves.
   No fades. Built only from showing and hiding words (no clip-path, no Web
   Animations), so it behaves the same in older TV browsers. */
const OUT_LINE_MS = 18;     // per line, bottom up
const BLINKS = 2;           // cursor blinks before typing starts
const BLINK_MS = 260;
const WORD_MS = 150;        // per word
const WORD_JITTER = 90;     // random extra per word, so it feels typed
const CURSOR_LINGER = 400;  // cursor stays after the last word
const IN_LINE_MS = 55;      // per line, top down

/* --------------------------------------------------------------- */
const stage = document.getElementById('stage');
const textEl = document.getElementById('text');
let scale = 1;

function fit() {
  scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.setProperty('--scale', scale);
}
window.addEventListener('resize', fit);
fit();

const LH = 44;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Every word becomes its own span, hidden until it is switched on */
function wrapWords(html) {
  return html.split(/(<[^>]+>)/).map(tok =>
    tok.charAt(0) === '<' ? tok : tok.split(' ').map(w => w ? '<span class="wd">' + w + '</span>' : w).join(' ')
  ).join('');
}
/* Group word spans into the visual lines they sit on, top to bottom */
function byLine(words) {
  const m = new Map();
  words.forEach(w => {
    const k = Math.floor((w.offsetTop + w.offsetHeight / 2) / LH);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(w);
  });
  return Array.from(m.keys()).sort((a, b) => a - b).map(k => m.get(k));
}

/* The first `typed` lines of the first paragraph (split at <br>, default 1) are typed;
   everything after them steps in line by line */
function render(st) {
  const firstP = st.text[0], rest = st.text.slice(1);
  const parts = firstP.split('<br>');
  const n = st.typed || 1;
  const typed = parts.slice(0, n).map(wrapWords).join('<br>');
  const after = parts.slice(n).map(wrapWords).join('<br>');
  textEl.innerHTML = '<p><span class="row1">' + typed + '</span>' + after + '</p>' +
    rest.map(t => '<p>' + wrapWords(t) + '</p>').join('');
  const cur = document.createElement('div');
  cur.className = 'cursor';
  textEl.appendChild(cur);
  const typedWords = Array.from(textEl.querySelectorAll('.row1 .wd'));
  const typedSet = new Set(typedWords);
  const restWords = Array.from(textEl.querySelectorAll('.wd')).filter(w => !typedSet.has(w));
  return { typedWords: typedWords, restLines: byLine(restWords) };
}

/* centre: true puts the words (not their box) in the middle of the screen */
function placeText(st) {
  textEl.style.transform = '';
  if (!st.centre) return;
  let x0 = Infinity, x1 = -Infinity, n;
  const tw = document.createTreeWalker(textEl, NodeFilter.SHOW_TEXT);
  while ((n = tw.nextNode())) {
    const r = document.createRange();
    r.selectNodeContents(n);
    Array.from(r.getClientRects()).forEach(b => {
      if (b.width) { x0 = Math.min(x0, b.left); x1 = Math.max(x1, b.right); }
    });
  }
  if (!(x1 > x0)) return;
  const s = stage.getBoundingClientRect(), t = textEl.getBoundingClientRect();
  const midX = ((x0 + x1) / 2 - s.left) / scale;
  const midY = (t.top - s.top) / scale + LH / 2;
  textEl.style.transform = 'translate(' + (CENTRE_X - midX).toFixed(1) + 'px, ' + (CENTRE_Y - midY).toFixed(1) + 'px)';
}

async function stepOut(me) {
  const cur = textEl.querySelector('.cursor');
  if (cur) cur.style.display = 'none';
  const lines = byLine(Array.from(textEl.querySelectorAll('.wd.on')));
  for (let k = lines.length - 1; k >= 0; k--) {
    lines[k].forEach(w => w.classList.remove('on'));
    await wait(OUT_LINE_MS);
    if (me !== run) return;
  }
}

async function typeRow1(me, words) {
  if (!words.length) return;
  const cur = textEl.querySelector('.cursor');
  const place = (el, end) => {
    cur.style.left = (end ? el.offsetLeft + el.offsetWidth + 3 : el.offsetLeft - 2) + 'px';
    cur.style.top = (el.offsetTop + 5) + 'px';
    cur.style.height = (el.offsetHeight - 10) + 'px';
  };
  place(words[0], false);
  cur.style.display = 'block';
  for (let k = 0; k < BLINKS; k++) {
    await wait(BLINK_MS); if (me !== run) return;
    cur.style.visibility = 'hidden';
    await wait(BLINK_MS); if (me !== run) return;
    cur.style.visibility = 'visible';
  }
  for (const w of words) {
    w.classList.add('on');
    place(w, true);
    await wait(WORD_MS + Math.random() * WORD_JITTER);
    if (me !== run) return;
  }
  await wait(CURSOR_LINGER);
  cur.style.display = 'none';
}

async function revealRest(me, lines) {
  for (const line of lines) {
    line.forEach(w => w.classList.add('on'));
    await wait(IN_LINE_MS);
    if (me !== run) return;
  }
}

let index = 0, timer = null, paused = false, run = 0;

async function show(i, first) {
  const me = ++run;
  clearTimeout(timer);

  if (!first) await stepOut(me);
  if (me !== run) return;

  const st = STATES[i];
  const parts = render(st);   // all words start hidden
  placeText(st);

  await typeRow1(me, parts.typedWords);
  if (me !== run) return;
  await revealRest(me, parts.restLines);
  if (me !== run) return;

  if (!paused) timer = setTimeout(() => go(index + 1), st.hold);
}

function go(i, first) {
  index = (i + STATES.length) % STATES.length;
  show(index, first);
}

/* Testing: → / ← next / previous, space pause, F fullscreen.
   URL: ?state=2 starts on state 2, &hold=1 freezes there. */
const params = new URLSearchParams(location.search);
if (params.get('hold') === '1') paused = true;
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(index + 1);
  if (e.key === 'ArrowLeft') go(index - 1);
  if (e.key === ' ') { paused = !paused; if (!paused) go(index + 1); else clearTimeout(timer); }
  if (e.key === 'f' || e.key === 'F') {
    const de = document.documentElement;
    if (!document.fullscreenElement) { if (de.requestFullscreen) de.requestFullscreen(); }
    else if (document.exitFullscreen) document.exitFullscreen();
  }
});

/* Marquee: each sentence is its own small element, laid end to end and moved
   left at a steady speed; one that leaves the left edge rejoins at the back. */
let mq = null;
function buildMarquee() {
  const track = document.getElementById('track');
  track.innerHTML = '';
  const items = [];
  let total = 0, longest = 0, k = 0;
  while (true) {
    const [t, c] = MARQUEE[k % MARQUEE.length];
    const s = document.createElement('span');
    s.className = 'mq';
    s.setAttribute('aria-hidden', 'true');
    s.textContent = t + '  ';
    if (c === 'white') s.style.color = '#fff';
    track.appendChild(s);
    const w = s.offsetWidth;
    longest = Math.max(longest, w);
    items.push({ el: s, x: total, w });
    total += w;
    k++;
    if (k % MARQUEE.length === 0 && total >= 1920 + longest) break;
  }
  mq = { items, total, t0: performance.now() };
}
function tickMarquee(now) {
  if (mq) {
    const off = ((now - mq.t0) / 1000 * MARQUEE_PX_PER_S) % mq.total;
    for (const it of mq.items) {
      let x = it.x - off;
      if (x < -it.w) x += mq.total;
      it.el.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;
    }
  }
  requestAnimationFrame(tickMarquee);
}
requestAnimationFrame(tickMarquee);

const start = Math.max(1, Math.min(STATES.length, parseInt(params.get('state') || '1', 10))) - 1;
if (params.get('bottom') === 'text' || params.get('bottom') === 'gif') BOTTOM = params.get('bottom');
function applyBottom() {
  const gif = BOTTOM === 'gif';
  const strip = document.getElementById('strip');
  if (gif) strip.src = 'fixers.gif';   // only loaded when the GIF strip is used
  strip.style.display = gif ? 'block' : 'none';
  const marquee = document.getElementById('marquee');
  marquee.style.display = gif ? 'none' : 'block';
  strip.style.bottom = marquee.style.bottom = SAFE_BOTTOM + 'px';
  document.getElementById('row').style.top = ROW_TOP + 'px';
}
applyBottom();

// ?bg=FF1F7A tries another pink on the screen without changing the file
const bgParam = params.get('bg');
if (bgParam && /^[0-9a-fA-F]{6}$/.test(bgParam)) document.documentElement.style.setProperty('--bg', '#' + bgParam);

// Self-update: reload when a newer version is published (skipped when opened as a local file)
if (location.protocol.startsWith('http')) {
  setInterval(() => {
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : null)
      .then(v => {
        v = v && v.trim();
        if (v && v !== BUILD) location.replace(location.pathname + '?v=' + encodeURIComponent(v));
      })
      .catch(() => {});
  }, 60000);
}
// Load both Areal styles before anything is measured or typed (gives up after 10 s)
const fontsReady = document.fonts
  ? Promise.race([
      Promise.all([document.fonts.load('500 42px Areal'), document.fonts.load('italic 500 42px Areal')]),
      new Promise(r => setTimeout(r, 10000))
    ]).catch(() => {})
  : Promise.resolve();
fontsReady.then(() => {
  if (BOTTOM === 'text') buildMarquee();
  go(start, true);
  // if the font only arrives later, re-measure the marquee so its loop stays seamless
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { if (BOTTOM === 'text') buildMarquee(); });
});
</script>
</body>
</html>
