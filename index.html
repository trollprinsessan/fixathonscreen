<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixathon</title>
<style>
  /* ABC Areal: uses the installed font if the screen's computer has it,
     or fonts/ABCAreal-Medium.woff2 + fonts/ABCAreal-MediumItalic.woff2 next to this file
     (only if your licence covers web use). Otherwise falls back to Helvetica Neue / Arial. */
  @font-face {
    font-family: "Areal";
    src: local("ABC Areal Medium"), local("ABCAreal-Medium"),
         url("fonts/ABCAreal-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal;
  }
  @font-face {
    font-family: "Areal";
    src: local("ABC Areal Medium Italic"), local("ABCAreal-MediumItalic"),
         url("fonts/ABCAreal-MediumItalic.woff2") format("woff2");
    font-weight: 500; font-style: italic;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #FF78C8; }
  body {
    color: #000;
    font-family: "Areal", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }

  /* Fixed 1920 x 1080 stage scaled to fit the screen */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }

  /* Label + text, vertically centred. Label sits on the text's first baseline,
     so it travels when the text block changes height. */
  .row {
    position: absolute; left: 320px; top: 492px;   /* FIXATHON at x = 320; top = centre above the marquee */
    transform: translateY(-50%);
    display: flex; align-items: baseline;
  }
  .left { width: 524px; }     /* text column starts at x = 844 */
  .label {
    font-size: 48px; line-height: 54px; letter-spacing: -0.4px;
    text-transform: uppercase;
  }
  /* Marquee, as on climaxbooks.com: body size, one line of air above and below,
     linear scroll, phrases alternating black and white */
  .marquee {
    position: absolute; left: 0; bottom: 0; width: 1920px;
    padding: 0; overflow: hidden; white-space: nowrap;
    font-size: 42px; line-height: 48px; letter-spacing: -0.4px;
  }
  .strip { position: absolute; left: 0; bottom: 0; width: 1920px; height: 210px; display: none; }
  .track { display: inline-flex; will-change: transform; }
  .track span { white-space: pre; }
  .track .w { color: #fff; }
  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(var(--shift)); } }
  .text {
    position: relative;
    width: 727px;
    font-size: 42px; line-height: 48px; letter-spacing: -0.4px;
  }
  .row1 { display: block; }
  .wd { visibility: hidden; }
  .wd.on { visibility: visible; }
  .cursor { position: absolute; width: 4px; background: #000; display: none; }
  .text p { margin-bottom: 48px; }
  .text p:last-child { margin-bottom: 0; }
  .nb { white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="row" id="row">
    <div class="left" id="left">
      <div class="label">Fixathon</div>
    </div>
    <div class="text" id="text"></div>
  </div>
  <img class="strip" id="strip" alt="">
  <div class="marquee" id="marquee" aria-label="We need bigger prompts. AI is the most powerful tool humanity has ever held. The question is what we choose to do with it. We’re calling on a new generation of problem engineers. Founders who will use this divine intelligence to tackle what matters: our climate, our health, our food systems, our future. Let’s prompt what matters.">
    <div class="track" id="track"></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   CONTENT, from Nina's Figma mockup. hold = ms on screen.
---------------------------------------------------------------- */
const STATES = [
  {
    hold: 15000,
    typed: 2,   // type the first two lines (the question too), then reveal the rest
    text: [
      '50 fixers. 24 hours. One question:<br><i>Can AI help turn climate commitments into action?</i>',
      'This is the <i>Fixathon</i>, Norrsken’s version of a hackathon.',
      '<span class="nb">50 multidisciplinary</span> <span class="nb">problem-solvers</span> from across Europe are building solutions with AI, data, and open tools to help get climate action back on track ahead of <i>COP31</i>.',
      'Come in, say hi!'
    ]
  },
  {
    hold: 15000,
    text: [
      'Curious to see what they are building?<br>Whether you build companies, fund them, work in policy, or just care about the planet, come watch the best teams pitch live and cheer on the winners.',
      'Fixathon Demos<br><i class="nb">Climate Solutions Built in 24 Hours</i><br>October 15, 14:10-15:00<br>Agora',
      'Spotlight On<br><i>The Fixathon Winning Team</i><br>October 15, 16:10-16:20<br>Town Hall'
    ]
  },
  {
    hold: 6000,
    text: ['prompt what matters.']
  }
];

/* Marquee phrases: [text, colour]. Two spaces between, like Climax. */
/* Distance from the bottom of the screen to the marquee. TVs often crop the
   edges of the picture (overscan), so it sits a little above the edge. */
const SAFE_BOTTOM = 48;

/* Bottom edge: 'gif' = fixers.gif strip, 'text' = the marquee below.
   Compare quickly with ?bottom=text or ?bottom=gif in the address. */
let BOTTOM = 'text';

/* Marquee copy, one sentence per entry, alternating black and white like Climax. */
const MARQUEE = [
  ['We need bigger prompts.', 'black'],
  ['AI is the most powerful tool humanity has ever held.', 'white'],
  ['The question is what we choose to do with it.', 'black'],
  ['We’re calling on a new generation of problem engineers.', 'white'],
  ['Founders who will use this divine intelligence to tackle what matters: our climate, our health, our food systems, our future.', 'black'],
  ['Let’s prompt what matters.', 'white']
];
const MARQUEE_PX_PER_S = 75;   // Climax's speed, scaled to this size

/* Motion: text steps out, label travels, first line is typed word by word
   with a cursor, then the rest steps in line by line. No fades. */
const OUT_LINE_MS = 18;     // per line, bottom up
const TRAVEL_MS = 480;      // label move
const BLINKS = 2;           // cursor blinks before typing starts
const BLINK_MS = 260;
const WORD_MS = 150;        // per word
const WORD_JITTER = 90;     // random extra per word, so it feels typed
const CURSOR_LINGER = 400;  // cursor stays after the last word
const IN_LINE_MS = 55;      // per line, top down
const TRAVEL_EASE = 'cubic-bezier(.7, 0, .25, 1)';

/* --------------------------------------------------------------- */
const stage = document.getElementById('stage');
const label = document.getElementById('left');   // FIXATHON travels with the text
const textEl = document.getElementById('text');
let scale = 1;

function fit() {
  scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.setProperty('--scale', scale);
}
window.addEventListener('resize', fit);
fit();

const LH = 48;
const lines = () => Math.max(1, Math.round(textEl.offsetHeight / LH));
const wait = ms => new Promise(r => setTimeout(r, ms));

async function stepOut() {
  if (!textEl.innerHTML) return;
  const n = lines();
  const a = textEl.animate(
    [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 100% 0)' }],
    { duration: n * OUT_LINE_MS, easing: `steps(${n}, jump-end)`, fill: 'forwards' }
  );
  await a.finished;
}

/* The first `typed` lines of the first paragraph (split at <br>, default 1) are typed word by word */
function wrapWords(html) {
  return html.split(/(<[^>]+>)/).map(tok =>
    tok.startsWith('<') ? tok : tok.split(' ').map(w => w ? `<span class="wd">${w}</span>` : w).join(' ')
  ).join('');
}
function render(st) {
  const [firstP, ...rest] = st.text;
  const parts = firstP.split('<br>');
  const n = st.typed || 1;
  const typed = parts.slice(0, n).map(wrapWords).join('<br>');
  const after = parts.slice(n).join('<br>');
  textEl.innerHTML = `<p><span class="row1">${typed}</span>${after}</p>` + rest.map(t => `<p>${t}</p>`).join('');
  const cur = document.createElement('div');
  cur.className = 'cursor';
  textEl.appendChild(cur);
  // height of everything below the first line
  return textEl.offsetHeight - textEl.querySelector('.row1').offsetHeight;
}

async function typeRow1(me) {
  const words = [...textEl.querySelectorAll('.wd')];
  const cur = textEl.querySelector('.cursor');
  const place = (el, end) => {
    cur.style.left = (end ? el.offsetLeft + el.offsetWidth + 3 : el.offsetLeft - 2) + 'px';
    cur.style.top = (el.offsetTop + 5) + 'px';
    cur.style.height = (el.offsetHeight - 10) + 'px';
  };
  place(words[0], false);
  cur.style.display = 'block';
  for (let k = 0; k < BLINKS; k++) {
    await wait(BLINK_MS); if (me !== run) return;
    cur.style.visibility = 'hidden';
    await wait(BLINK_MS); if (me !== run) return;
    cur.style.visibility = 'visible';
  }
  for (const w of words) {
    w.classList.add('on');
    place(w, true);
    await wait(WORD_MS + Math.random() * WORD_JITTER);
    if (me !== run) return;
  }
  await wait(CURSOR_LINGER);
  cur.style.display = 'none';
}

async function revealRest(restH) {
  if (restH <= 0) return;
  const n = Math.round(restH / LH);
  const a = textEl.animate(
    [{ clipPath: `inset(0 0 ${restH}px 0)` }, { clipPath: 'inset(0 0 0px 0)' }],
    { duration: n * IN_LINE_MS, easing: `steps(${n}, jump-start)`, fill: 'forwards' }
  );
  await a.finished;
}

let index = 0, timer = null, paused = false, run = 0;

async function show(i, first) {
  const me = ++run;
  clearTimeout(timer);

  if (!first) await stepOut();
  if (me !== run) return;

  // swap content while hidden, then let the label travel to the new first line
  const before = label.getBoundingClientRect().top;
  textEl.getAnimations().forEach(a => a.cancel());
  const restH = render(STATES[i]);
  textEl.style.clipPath = `inset(0 0 ${restH}px 0)`;   // only the (still empty) first line is open
  const after = label.getBoundingClientRect().top;
  const dy = (before - after) / scale;

  if (!first && Math.abs(dy) > 0.5) {
    await label.animate(
      [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
      { duration: TRAVEL_MS, easing: TRAVEL_EASE }
    ).finished;
  }
  if (me !== run) return;

  await typeRow1(me);
  if (me !== run) return;
  await revealRest(restH);
  if (me !== run) return;

  if (!paused) timer = setTimeout(() => go(index + 1), STATES[i].hold);
}

function go(i, first) {
  index = (i + STATES.length) % STATES.length;
  show(index, first);
}

/* Testing: → / ← next / previous, space pause, F fullscreen.
   URL: ?state=2 starts on state 2, &hold=1 freezes there. */
const params = new URLSearchParams(location.search);
if (params.get('hold') === '1') paused = true;
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(index + 1);
  if (e.key === 'ArrowLeft') go(index - 1);
  if (e.key === ' ') { paused = !paused; if (!paused) go(index + 1); else clearTimeout(timer); }
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

/* Marquee: one group of phrases, repeated to fill the width, scrolled by one group */
function buildMarquee() {
  const track = document.getElementById('track');
  const group = () => {
    const g = document.createElement('span');
    g.style.display = 'inline-flex';
    g.setAttribute('aria-hidden', 'true');
    MARQUEE.forEach(([t, c]) => {
      const s = document.createElement('span');
      s.textContent = t + '  ';
      if (c === 'white') s.className = 'w';
      g.appendChild(s);
    });
    return g;
  };
  track.innerHTML = '';
  const first = group();
  track.appendChild(first);
  const w = first.offsetWidth;
  const copies = Math.ceil(1920 / w) + 1;
  for (let i = 1; i < copies; i++) track.appendChild(group());
  track.style.setProperty('--shift', `-${w}px`);
  track.style.animation = `scrollX ${(w / MARQUEE_PX_PER_S).toFixed(2)}s linear infinite`;
}

const start = Math.max(1, Math.min(STATES.length, parseInt(params.get('state') || '1', 10))) - 1;
if (params.get('bottom') === 'text' || params.get('bottom') === 'gif') BOTTOM = params.get('bottom');
function applyBottom() {
  const gif = BOTTOM === 'gif';
  const strip = document.getElementById('strip');
  if (gif) strip.src = 'fixers.gif';   // only loaded when the GIF strip is used
  strip.style.display = gif ? 'block' : 'none';
  const marquee = document.getElementById('marquee');
  marquee.style.display = gif ? 'none' : 'block';
  strip.style.bottom = marquee.style.bottom = SAFE_BOTTOM + 'px';
  // centre the text block in the space above whichever strip is showing
  document.getElementById('row').style.top = ((1080 - SAFE_BOTTOM - (gif ? 210 : 48)) / 2) + 'px';
}
applyBottom();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (BOTTOM === 'text') buildMarquee(); go(start, true); });
</script>
</body>
</html>
